# KallioInnovations workstation settings.
# Everything in this file is public. The two KI_INSTALL_* values are
# deliberately public too: they exist only between the automated install and
# bootstrap.sh, which replaces both. ki-check fails if either still works.

KI_REPO_URL="https://github.com/KallioInnovations-Oy/workstation-bootstrap.git"
KI_OS_VERSION="26.04"

KI_ADMIN_USER="kiadmin"
KI_HOST_PREFIX="ki-ws-"

# Must match autoinstall.yaml
KI_INSTALL_LUKS_PASSPHRASE="ki-install-temporary"
KI_INSTALL_ADMIN_HASH='$6$kiinstalltemp01$52fkQNEL60QCRUb6tCsuFRXC.kbbi3lDTtoTmoaNKGF.7fwDrYYIHIKpGyD7KVuraHjAgdJf6L1T5siDckGUA1'

# Install locations on the workstation
KI_LIB_DIR="/usr/local/lib/ki"
KI_STATE_DIR="/var/lib/ki"
KI_ESCROW_DIR="/var/lib/ki-escrow"
KI_SYNC_DIR="/opt/ki/workstation-bootstrap"
KI_BACKGROUND_DIR="/usr/share/backgrounds/kallioinnovations"
